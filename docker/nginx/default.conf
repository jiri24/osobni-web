# Statický web z Jigsaw buildu. TLS a doménu řeší Caddy na hostiteli.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Přesměrování relativně, ne na interní http://…:8080
    absolute_redirect off;

    gzip on;
    # Komprimovat i požadavky přes proxy (Caddy)
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml;

    # Soubory z Vite mají v názvu hash, smí se cachovat natrvalo
    location /assets/build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
